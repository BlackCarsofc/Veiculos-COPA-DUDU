<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Cars - Lista de Spawn</title>
  <style>
    :root {
      --bg: #07050c;
      --bg-2: #12091f;
      --card: rgba(22, 13, 35, 0.82);
      --card-2: rgba(50, 26, 79, 0.72);
      --purple: #9b35ff;
      --purple-2: #d46bff;
      --white: #f8f5ff;
      --muted: #b7a9ca;
      --line: rgba(170, 85, 255, 0.26);
      --success: #35ffb2;
      --shadow: 0 0 34px rgba(155, 53, 255, 0.25);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at top left, rgba(155, 53, 255, 0.28), transparent 34%),
        radial-gradient(circle at bottom right, rgba(212, 107, 255, 0.18), transparent 32%),
        linear-gradient(135deg, #050308 0%, #0c0615 45%, #09050e 100%);
      min-height: 100vh;
    }

    .page {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 60px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 34px;
      background:
        linear-gradient(135deg, rgba(20, 10, 32, 0.92), rgba(10, 6, 18, 0.86)),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 90px);
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: -160px -80px auto auto;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(155, 53, 255, 0.42), transparent 68%);
      filter: blur(2px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 22px;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 102px;
      height: 102px;
      object-fit: contain;
      border-radius: 24px;
      padding: 9px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255,255,255,0.10);
      filter: drop-shadow(0 0 18px rgba(155, 53, 255, 0.48));
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 0.95;
      letter-spacing: -1.4px;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 17px;
      max-width: 720px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
      position: relative;
      z-index: 1;
    }

    .search {
      flex: 1 1 340px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      color: var(--white);
      outline: none;
      padding: 16px 18px;
      border-radius: 16px;
      font-size: 15px;
    }

    .counter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      padding: 0 18px;
      border-radius: 16px;
      color: var(--white);
      background: linear-gradient(135deg, rgba(155,53,255,.32), rgba(255,255,255,.06));
      border: 1px solid var(--line);
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat( auto-fit, minmax(330px, 1fr) );
      gap: 20px;
      margin-top: 24px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(180deg, var(--card), rgba(10,6,18,0.88));
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(155,53,255,0.15), transparent 35%);
      pointer-events: none;
    }

    .card-head {
      padding: 22px 22px 14px;
      position: relative;
      z-index: 1;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--purple-2);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .car-name {
      margin: 0 0 12px;
      min-height: 56px;
      font-size: 21px;
      line-height: 1.25;
      letter-spacing: -0.4px;
      text-transform: uppercase;
    }

    .spawn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(255,255,255,0.055);
      border-radius: 15px;
      padding: 12px 12px 12px 14px;
    }

    .spawn-code {
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      color: #fff;
      overflow-wrap: anywhere;
    }

    .copy-btn {
      border: 0;
      cursor: pointer;
      color: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--purple), #5f16ad);
      box-shadow: 0 0 16px rgba(155, 53, 255, 0.36);
      transition: transform .2s ease, filter .2s ease;
      white-space: nowrap;
    }

    .copy-btn:hover { transform: translateY(-1px); filter: brightness(1.12); }

    .photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 22px 22px;
      position: relative;
      z-index: 1;
    }

    .photo-link {
      min-height: 86px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.11);
      background:
        linear-gradient(135deg, rgba(155,53,255,0.18), rgba(255,255,255,0.04)),
        #10091b;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-decoration: none;
      font-weight: 800;
      font-size: 12px;
      text-align: center;
      padding: 8px;
      position: relative;
    }

    .photo-link img {
      width: 100%;
      height: 100%;
      min-height: 86px;
      object-fit: cover;
      display: block;
    }

    .empty-photo {
      border: 1px dashed rgba(212, 107, 255, 0.38);
    }

    .howto {
      margin-top: 24px;
      padding: 22px;
      border-radius: 22px;
      background: rgba(255,255,255,0.055);
      border: 1px solid var(--line);
      color: var(--muted);
      line-height: 1.55;
    }

    .howto b { color: #fff; }
    code {
      color: #fff;
      background: rgba(155,53,255,0.22);
      border: 1px solid rgba(155,53,255,0.28);
      border-radius: 8px;
      padding: 2px 6px;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .hero { padding: 24px; }
      .brand { align-items: flex-start; }
      .logo { width: 74px; height: 74px; }
      .photos { grid-template-columns: repeat(2, 1fr); }
      .counter { min-height: 50px; width: 100%; }
    }
  </style>

  <script>
    /* Logo via link: suporta query ?logo=URL ou input + botão */
    document.addEventListener('DOMContentLoaded', () => {
      const logoImg = document.querySelector('.logo');
      function applyLogoFromInput() {
        const input = document.getElementById('logoUrlInput');
        if (!input || !logoImg) return;
        const url = input.value.trim();
        if (url) logoImg.src = url;
      }
      const btn = document.getElementById('applyLogoBtn');
      if (btn) btn.addEventListener('click', applyLogoFromInput);
      // aplica automaticamente se houver ?logo=URL na query
      try {
        const params = new URLSearchParams(window.location.search);
        const q = params.get('logo');
        if (q && logoImg) logoImg.src = q;
      } catch (e) {}
    });

    const grid = document.getElementById('carsGrid');
    const counter = document.getElementById('counter');
    const searchInput = document.getElementById('searchInput');

    function isRealImageLink(url) {
      return url && !url.includes('COLE_AQUI') && /^https?:\/\//i.test(url.trim());
    }

    function renderCars(list) {
      grid.innerHTML = list.map((car, index) => `
        <article class="card">
          <div class="card-head">
            <div class="tag">◆ Veículo #${String(index + 1).padStart(2, '0')}</div>
            <h2 class="car-name">${car.name}</h2>
            <div class="spawn-row">
              <div>
                <div style="color: var(--muted); font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px;">Spawn</div>
                <div class="spawn-code">${car.spawn}</div>
              </div>
              <button class="copy-btn" onclick="copySpawn('${car.spawn}', this)">Copiar</button>
            </div>
          </div>
          <div class="photos">
            ${car.photos.map((photo, i) => isRealImageLink(photo) ?
              `<a class="photo-link" href="${photo}" target="_blank" rel="noopener"><img src="${photo}" alt="${car.name} - Foto ${i + 1}" onerror="this.parentElement.classList.add('empty-photo'); this.remove();" /></a>` :
              `<div class="photo-link empty-photo">Foto ${i + 1}<br><small>Cole o link no HTML</small></div>`
            ).join('')}
          </div>
        </article>
      `).join('');
      counter.textContent = `${list.length} veículo${list.length === 1 ? '' : 's'}`;
    }

    function copySpawn(spawn, btn) {
      navigator.clipboard.writeText(spawn).then(() => {
        const old = btn.textContent;
        btn.textContent = 'Copiado!';
        btn.style.background = 'linear-gradient(135deg, var(--success), #117a55)';
        setTimeout(() => { btn.textContent = old; btn.style.background = ''; }, 1100);
      });
    }

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase().trim();
      renderCars(cars.filter(car =>
        car.name.toLowerCase().includes(q) || car.spawn.toLowerCase().includes(q)
      ));
    });

    renderCars(cars);
  </script>
